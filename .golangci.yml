version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - nestif
    - nilerr
    - paralleltest
    - prealloc
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
  settings:
    nestif:
      min-complexity: 3
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 25
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    testifylint:
      enable-all: true
    sloglint:
      static-msg: true
      no-mixed-args: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo
          - errcheck
